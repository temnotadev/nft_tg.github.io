<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telegram Gifts</title>
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">
    <h1>🎁 nft.tg</h1>
    <div class="stars">⭐ Stars: <span id="starCount">10</span></div>

    <button id="openCase">Open Case (5⭐)</button>
    <div class="inventoryTitle">Your Gifts</div>
    <div id="inventory"></div>
  </div>

  <div id="casePopup" class="hidden">
    <div class="popup">
      <h2>Opening Case...</h2>
      <div id="giftResult"></div>
      <button id="closePopup">Close</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
