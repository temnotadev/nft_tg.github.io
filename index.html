<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🎁 Modern Gift Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Modern Google Font */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: linear-gradient(180deg, #121212, #1f1f28);
  color: #fff;
  height: 100vh;
  overflow-x: hidden;
  scroll-behavior: smooth;
}

.container {
  padding: 25px 20px 300px; /* extra bottom space for bottom bar & watermark */
  margin-bottom: 40px; /* push everything up slightly */
}

h1 {
  font-size: 2.4em;
  font-weight: 700;
  text-align: center;
  color: #ffd700;
  margin-bottom: 30px;
  letter-spacing: 1px;
  text-shadow: 0 0 12px rgba(255,215,0,0.5);
}

/* Gift Card Styling */
.gift {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(15px);
  border-radius: 20px;
  padding: 18px 25px;
  margin-bottom: 20px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.5);
  transition: transform 0.3s, background 0.3s;
}

.gift:hover {
  transform: translateY(-6px);
  background: rgba(255,255,255,0.12);
}

.gift img {
  width: 70px;
  height: 70px;
  border-radius: 16px;
  border: 2px solid rgba(255,255,255,0.3);
  margin-right: 20px;
}

.gift-info {
  flex-grow: 1;
  text-align: left;
}

.gift-info span {
  display: block;
  font-weight: 600;
  font-size: 1.1em;
  margin-bottom: 4px;
}

.gift-info small {
  color: #ccc;
  font-weight: 400;
}

/* Buy Button Styling */
.gift button {
  padding: 12px 20px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(135deg, #ffdd00, #ff9500);
  color: #121212;
  font-weight: 700;
  cursor: pointer;
  font-size: 1em;
  transition: transform 0.2s, box-shadow 0.2s;
}

.gift button:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 15px rgba(255, 215, 0, 0.5);
}

/* Modern Floating Bottom Bar */
.bottom-bar {
  position: fixed;
  bottom: 1px;
  left: 50%;
  transform: translateX(-50%);
  width: 92%;
  max-width: 650px;
  backdrop-filter: blur(28px);
  display: flex;
  /* CHANGE 1: Align items to the right end */
  justify-content: flex-end; 
  align-items: center;
  padding: 14px 20px;
  border-radius: 28px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  z-index: 100;
  transition: backdrop-filter 0.3s ease;
  height: 10%;
}
  
.bottom-bar button {
  background: rgba(255,255,255,0.15);
  border: none;
  color: #fff;
  font-weight: 600;
  font-size: 1em;
  padding: 10px 18px;
  margin: 0 10px;
  border-radius: 18px;
  cursor: pointer;
  transition: 0.3s;
}

.bottom-bar button:hover {
  background: rgba(255,255,255,0.3);
  transform: translateY(-3px);
}

/* Optional: enhance blur on scroll */
body::-webkit-scrollbar {
  width: 6px;
}
body::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.1);
  border-radius: 3px;
}

</style>
</head>
<body>

<div class="container">
  <h1>🎁 Gift Shop</h1>

  <!-- Gifts (A-H) for scrolling -->
  <div class="gift">
    <img src="https://i.ibb.co/hJrkJQHK/diamond.png" alt="Gift A">
    <div class="gift-info">
      <span>Gift A</span>
      <small>100⭐</small>
    </div>
    <button onclick="buyGift('Gift A',100,'https://i.ibb.co/hJrkJQHK/diamond.png')">Buy</button>
  </div>

  <div class="gift">
    <img src="https://i.ibb.co/BmzRHNh/2.png" alt="Gift B">
    <div class="gift-info">
      <span>Gift B</span>
      <small>250⭐</small>
    </div>
    <button onclick="buyGift('Gift B',250,'https://i.ibb.co/BmzRHNh/2.png')">Buy</button>
  </div>

  <div class="gift">
    <img src="https://i.ibb.co/spDZhQXh/4.png" alt="Gift C">
    <div class="gift-info">
      <span>Gift C</span>
      <small>500⭐</small>
    </div>
    <button onclick="buyGift('Gift C',500,'https://i.ibb.co/spDZhQXh/4.png')">Buy</button>
  </div>

  <div class="gift">
    <img src="https://i.ibb.co/CKF4Mx7/5.png" alt="Gift D">
    <div class="gift-info">
      <span>Gift D</span>
      <small>750⭐</small>
    </div>
    <button onclick="buyGift('Gift D',750,'https://i.ibb.co/CKF4Mx7/5.png')">Buy</button>
  </div>

  <div class="gift">
    <img src="https://i.ibb.co/N2wTYsV/6.png" alt="Gift E">
    <div class="gift-info">
      <span>Gift E</span>
      <small>1200⭐</small>
    </div>
    <button onclick="buyGift('Gift E',1200,'https://i.ibb.co/N2wTYsV/6.png')">Buy</button>
  </div>

  <div class="gift">
    <img src="https://i.ibb.co/6Y7P2vK/7.png" alt="Gift F">
    <div class="gift-info">
      <span>Gift F</span>
      <small>2000⭐</small>
    </div>
    <button onclick="buyGift('Gift F',2000,'https://i.ibb.co/6Y7P2vK/7.png')">Buy</button>
  </div>

  <div class="gift">
    <img src="https://i.ibb.co/px7VQYZ/8.png" alt="Gift G">
    <div class="gift-info">
      <span>Gift G</span>
      <small>3500⭐</small>
    </div>
    <button onclick="buyGift('Gift G',3500,'https://i.ibb.co/px7VQYZ/8.png')">Buy</button>
  </div>

  <div class="gift">
    <img src="https://i.ibb.co/3pZT0yY/9.png" alt="Gift H">
    <div class="gift-info">
      <span>Gift H</span>
      <small>5000⭐</small>
    </div>
    <button onclick="buyGift('Gift H',5000,'https://i.ibb.co/3pZT0yY/9.png')">Buy</button>
  </div>

</div>

<!-- Bottom Bar with Actions only -->
<div class="bottom-bar">
  <button onclick="claimDaily()">🎁 Claim Daily</button>
  <button onclick="sendGiftPrompt()">📨 Send Gift</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
tg.ready();

function buyGift(name, price, image){
  tg.sendData(JSON.stringify({action:'buy', name, price, image}));
}

function claimDaily(){
  tg.sendData(JSON.stringify({action:'daily'}));
}

function sendGiftPrompt(){
  const recipient = prompt("Enter recipient ID:");
  const gift = prompt("Enter gift name (Gift A/B/C/D/E/F/G/H):");
  if(!recipient || !gift) return;
  tg.sendData(JSON.stringify({action:'send', recipient, gift}));
}
</script>

</body>
</html>
