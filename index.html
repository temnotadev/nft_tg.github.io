<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Gift Cases</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      font-family: 'Segoe UI', sans-serif;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      flex-direction: column;
      background-image: url('https://images.unsplash.com/photo-1606813902913-2348f0d3fbee');
      background-size: cover;
      background-position: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 20px 40px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #0088cc, #005580);
      color: white;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎁 Open a Gift Case</h1>
    <p id="user"></p>
    <button onclick="openCase()">Open Case</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // make app fullscreen
    const user = tg.initDataUnsafe?.user;
    document.getElementById('user').textContent = user ? `Hello, ${user.first_name}!` : 'Hello!';

    function openCase() {
      tg.showAlert('You got a Rare Gift! 🎉');
    }
  </script>
</body>
</html>
